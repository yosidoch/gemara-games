<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תצוגת כיתה — Gemara Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://itkkiuxzbtircgifaoao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0a2tpdXh6YnRpcmNnaWZhb2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDg2NDUsImV4cCI6MjA5ODAyNDY0NX0.H2_Me-hSwaBaugj538Ks5myT_cgb-nA4Dk851XX7sNI';
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F6F7FB;
      --card: #fff; --text: #182033; --muted: #5B6474; --border: #E4E7EF;
      --radius: 16px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
      --accent: #4F46E5; --accent-dark: #4338CA; --accent-soft: #EEF0FE;
      --green: #16A34A; --blue: #2563EB; --amber: #B45309;
      --red: #DC2626; --purple: #7C3AED; --purple-soft: #F1EAFE;
      --font-ui: 'Rubik', sans-serif; --font-he: 'Frank Ruhl Libre', serif;
    }
    html { font-size: 16px; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100vh; }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    .accent-bar { height: 4px; background: linear-gradient(90deg, #4F46E5, #7C3AED, #2563EB); }

    .site-header { max-width: 900px; margin: 0 auto; padding: 26px 24px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .header-end { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .back-link { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: #fff; transition: all .2s; min-height: 42px; }
    .back-link:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: #C9CDF7; }
    .site-title h1 { font-size: 22px; font-weight: 800; }
    .site-title p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .refresh-note { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
    .refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }

    .lang-btn { background: #fff; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 8px 16px; font-family: var(--font-ui); font-weight: 700; font-size: 13px; cursor: pointer; min-height: 38px; transition: all .15s; }
    .lang-btn:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: #C9CDF7; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.7); }
    }

    main { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .card-header h2 { font-size: 15px; font-weight: 700; }
    .card-body { padding: 20px; }

    /* Test info bar */
    .test-info-bar { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; }
    .test-info-item { display: flex; flex-direction: column; gap: 3px; }
    .test-info-label { font-size: 11.5px; font-weight: 700; color: var(--muted); }
    .test-info-value { font-size: 14px; font-weight: 600; }

    /* Access code — big, for projecting to the class */
    .code-box {
      margin-inline-start: auto; text-align: center; background: var(--purple-soft);
      border: 2px dashed #C4B5FD; border-radius: 14px; padding: 10px 22px;
    }
    .code-box .code-label { font-size: 12px; font-weight: 800; color: #6D28D9; letter-spacing: .05em; }
    .code-box .code-value { font-size: 34px; font-weight: 900; color: #5B21B6; letter-spacing: .18em; direction: ltr; line-height: 1.15; }

    /* Avg card */
    .avg-card { text-align: center; padding: 32px 24px; }
    .avg-number { font-size: 72px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
    .avg-label { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .avg-sub { font-size: 13px; color: var(--muted); }

    /* Student list */
    .student-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .student-table th { text-align: start; font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 10px 12px; background: #FAFBFF; border-bottom: 1px solid var(--border); }
    .student-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .student-table tr:last-child td { border-bottom: none; }
    .student-table tbody tr:hover td { background: #FAFBFF; }

    .score-bar-wrap { background: #E4E7EF; border-radius: 999px; height: 8px; width: 100%; min-width: 60px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 999px; transition: width .4s; }

    /* Empty state */
    .empty-state { text-align: center; padding: 48px 24px; }
    .empty-state .ei { font-size: 40px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; color: var(--muted); line-height: 1.7; }
    .waiting-dots { display: inline-flex; gap: 6px; margin-top: 16px; }
    .waiting-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); opacity: .3; animation: waiting-pulse 1.4s ease-in-out infinite; }
    .waiting-dots span:nth-child(2) { animation-delay: .2s; }
    .waiting-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes waiting-pulse {
      0%, 80%, 100% { opacity: .3; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .error-state { text-align: center; padding: 48px 24px; }
    .error-state .ei { font-size: 40px; margin-bottom: 14px; }
    .error-state p { font-size: 15px; color: var(--muted); }
    .error-state a { display: inline-block; margin-top: 16px; color: var(--accent-dark); text-decoration: none; font-weight: 600; }

    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 600px) {
      .test-info-bar { gap: 12px; }
      .code-box { margin-inline-start: 0; width: 100%; }
      .avg-number { font-size: 56px; }
    }
  </style>
</head>
<body>

<div class="accent-bar" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-right">
    <a class="back-link" href="teacher_dashboard.html" id="backLink">→ ללוח המורה</a>
    <div class="site-title">
      <h1 id="pageTitle">📊 תצוגת כיתה חיה</h1>
      <p id="headerSub">טוען מבחן…</p>
    </div>
  </div>
  <div class="header-end">
    <div class="refresh-note" role="status">
      <span class="refresh-dot" aria-hidden="true"></span>
      <span id="refreshNote">מתרענן אוטומטית כל 10 שניות</span>
    </div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
  </div>
</header>

<main>
  <div class="card" id="testInfoCard" style="display:none">
    <div class="card-body">
      <div class="test-info-bar" id="testInfoBar"></div>
    </div>
  </div>

  <div class="card" id="avgCard" aria-live="polite">
    <div class="avg-card">
      <div class="empty-state">
        <div class="ei" aria-hidden="true">⏳</div>
        <p id="loadingMsg">טוען…</p>
      </div>
    </div>
  </div>

  <div class="card" id="studentListCard" style="display:none">
    <div class="card-header"><h2 id="studentListTitle">תוצאות תלמידים</h2></div>
    <div id="studentListBody"></div>
  </div>
</main>

<script>
// ── Supabase ──────────────────────────────────────────────
let sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

// ── UI language (shared with the teacher dashboard) ───────
let LANG = localStorage.getItem('gm_lang') === 'en' ? 'en' : 'he';
function T(he, en) { return LANG === 'he' ? he : en; }

// ── State ─────────────────────────────────────────────────
const testId = new URLSearchParams(location.search).get('test');
let testRow = null;
let lastResultsData = null;   // cached for re-render on language switch
let errState = null;          // 'noid' | 'nodb' | 'notfound'

// Access code: same derivation as the dashboard and student test page
function accessCode(id) {
  const hex = String(id || '').replace(/-/g, '').slice(0, 8);
  const n = parseInt(hex, 16);
  if (isNaN(n)) return '';
  return String(n % 10000).padStart(4, '0');
}

// ── Utilities ─────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function pctColor(pct) {
  if (pct >= 90) return { text: '#15803D', bg: '#DCFCE7' };
  if (pct >= 70) return { text: '#1D4ED8', bg: '#DBEAFE' };
  if (pct >= 50) return { text: '#A16207', bg: '#FEF9C3' };
  return { text: '#DC2626', bg: '#FEE2E2' };
}

// ── Language ──────────────────────────────────────────────
function dirLabel(d) {
  return d === 'he_to_en' ? T('עברית → אנגלית', 'Hebrew → English')
       : d === 'en_to_he' ? T('אנגלית → עברית', 'English → Hebrew')
       : T('מעורב 🔀', 'Mixed 🔀');
}

function statusLabel(s) {
  return { draft: T('טיוטה','Draft'), active: T('פעיל','Active'), closed: T('סגור','Closed') }[s] || s;
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = LANG === 'he' ? 'English' : 'עברית';
  document.getElementById('backLink').textContent = T('→ ללוח המורה', '← Teacher Dashboard');
  document.getElementById('pageTitle').textContent = T('📊 תצוגת כיתה חיה', '📊 Live Class View');
  document.getElementById('refreshNote').textContent = T('מתרענן אוטומטית כל 10 שניות', 'Auto-refreshes every 10 seconds');
  const slt = document.getElementById('studentListTitle');
  if (slt) slt.textContent = T('תוצאות תלמידים', 'Student Results');

  if (errState) { renderError(errState); return; }
  if (testRow) renderTestInfo();
  if (lastResultsData !== null) renderResults(lastResultsData);
}

function toggleLang() {
  LANG = LANG === 'he' ? 'en' : 'he';
  localStorage.setItem('gm_lang', LANG);
  applyLang();
}

// ── Render ─────────────────────────────────────────────────
function renderError(kind) {
  errState = kind;
  const msgs = {
    noid: T('לא סופק מזהה מבחן.', 'No test ID was provided.'),
    nodb: T('אין חיבור למסד הנתונים.', 'No database connection.'),
    notfound: T('המבחן לא נמצא או שטעינתו נכשלה.', 'The test was not found or failed to load.')
  };
  const icon = kind === 'nodb' ? '⚠️' : '❌';
  document.getElementById('avgCard').innerHTML = `<div class="error-state">
    <div class="ei" aria-hidden="true">${icon}</div>
    <p>${msgs[kind]}</p>
    <a href="teacher_dashboard.html">${T('→ חזרה ללוח המורה', '← Back to the Teacher Dashboard')}</a>
  </div>`;
}

function renderTestInfo() {
  const test = testRow;
  const wordCount = Array.isArray(test.word_ids) ? test.word_ids.length : 0;
  const dir = dirLabel(test.direction);
  document.getElementById('headerSub').textContent =
    T(`${wordCount} מילים · ${test.timer_per_word} שנ' למילה · ${dir}`,
      `${wordCount} words · ${test.timer_per_word}s per word · ${dir}`);

  const infoCard = document.getElementById('testInfoCard');
  infoCard.style.display = '';
  document.getElementById('testInfoBar').innerHTML = `
    <div class="test-info-item">
      <span class="test-info-label">${T('כיוון','Direction')}</span>
      <span class="test-info-value">${esc(dir)}</span>
    </div>
    <div class="test-info-item">
      <span class="test-info-label">${T('מילים','Words')}</span>
      <span class="test-info-value">${wordCount}</span>
    </div>
    <div class="test-info-item">
      <span class="test-info-label">${T('טיימר','Timer')}</span>
      <span class="test-info-value">${test.timer_per_word} ${T("שנ' למילה",'s per word')}</span>
    </div>
    <div class="test-info-item">
      <span class="test-info-label">${T('מצב','Status')}</span>
      <span class="test-info-value" style="color:${test.status === 'active' ? '#15803D' : test.status === 'closed' ? 'var(--red)' : 'var(--muted)'}">${esc(statusLabel(test.status))}</span>
    </div>
    <div class="code-box">
      <div class="code-label">ACCESS CODE</div>
      <div class="code-value">${accessCode(test.id)}</div>
    </div>`;
}

function renderResults(results) {
  lastResultsData = results;
  const avgCard = document.getElementById('avgCard');
  const studentListCard = document.getElementById('studentListCard');
  const studentListBody = document.getElementById('studentListBody');

  if (!results || !results.length) {
    avgCard.innerHTML = `<div class="avg-card">
      <div class="empty-state">
        <div class="ei" aria-hidden="true">📭</div>
        <p>${T('ממתין להגשות…','Waiting for submissions…')}</p>
        <div class="waiting-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>`;
    studentListCard.style.display = 'none';
    return;
  }

  const avg = Math.round(results.reduce((s, r) => s + (r.total ? r.score / r.total * 100 : 0), 0) / results.length);
  const col = pctColor(avg);

  avgCard.innerHTML = `<div class="avg-card">
    <div class="avg-number" style="color:${col.text}">${avg}%</div>
    <div class="avg-label">${T('ממוצע כיתתי','Class Average')}</div>
    <div class="avg-sub">${results.length === 1
      ? T('תלמיד/ה אחד/ת הגיש/ה', '1 student submitted')
      : T(results.length + ' תלמידים הגישו', results.length + ' students submitted')}</div>
  </div>`;

  studentListCard.style.display = '';
  studentListBody.innerHTML = `
    <div style="overflow-x:auto"><table class="student-table">
      <thead><tr>
        <th>${T('תלמיד/ה','Student')}</th>
        <th style="width:90px">${T('ציון','Score')}</th>
        <th style="width:60px">%</th>
        <th style="width:140px">${T('התקדמות','Progress')}</th>
      </tr></thead>
      <tbody>
        ${results.map(r => {
          const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
          const c = pctColor(pct);
          return `<tr>
            <td style="font-weight:600" dir="auto">${esc(r.student_name || T('אנונימי','Anonymous'))}</td>
            <td dir="ltr" style="text-align:${LANG === 'he' ? 'right' : 'left'}">${r.score}/${r.total}</td>
            <td><span style="font-weight:700;color:${c.text}">${pct}%</span></td>
            <td>
              <div class="score-bar-wrap" role="img" aria-label="${pct}${T(' אחוז',' percent')}">
                <div class="score-bar-fill" style="width:${pct}%;background:${c.text}"></div>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
}

// ── Fetch & Render ─────────────────────────────────────────
async function fetchAndRender() {
  try {
    const { data: results, error } = await sb.from('test_results')
      .select('*')
      .eq('test_id', testId)
      .order('score', { ascending: false });
    if (error) throw error;
    renderResults(results || []);
  } catch(e) {
    // silently keep old state on poll errors
  }
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  applyLang();

  if (!testId) { renderError('noid'); return; }
  if (!sb) { renderError('nodb'); return; }

  // Fetch test info
  try {
    const { data: test, error: testErr } = await sb.from('tests').select('*').eq('id', testId).single();
    if (testErr || !test) throw testErr || new Error('Test not found');
    testRow = test;
    renderTestInfo();
  } catch(e) {
    renderError('notfound');
    return;
  }

  // Initial fetch
  await fetchAndRender();

  // Poll every 10 seconds
  setInterval(fetchAndRender, 10000);
}

init();
</script>
</body>
</html>
