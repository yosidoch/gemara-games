  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://itkkiuxzbtircgifaoao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0a2tpdXh6YnRpcmNnaWZhb2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDg2NDUsImV4cCI6MjA5ODAyNDY0NX0.H2_Me-hSwaBaugj538Ks5myT_cgb-nA4Dk851XX7sNI';
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: linear-gradient(135deg, #f8faff 0%, #fff8f0 50%, #f0fff8 100%);
      --card: #fff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --radius: 16px; --shadow: 0 8px 32px rgba(0,0,0,0.1);
      --green: #22c55e; --blue: #3b82f6; --red: #ef4444; --purple: #8b5cf6;
      --font-ui: 'Rubik', sans-serif; --font-he: 'Frank Ruhl Libre', serif;
    }
    html { font-size: 16px; }
    body { font-family: var(--font-ui); background: var(--bg); background-attachment: fixed; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .rainbow-bar { height: 5px; background: linear-gradient(90deg,#f97316,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899); flex-shrink: 0; }

    /* ── Screens ── */
    .screen { display: none; flex: 1; align-items: center; justify-content: center; padding: 24px; }
    .screen.active { display: flex; }

    /* ── Splash / Name entry ── */
    .splash-card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 48px 40px; text-align: center; max-width: 460px; width: 100%;
    }
    .splash-card .block-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    .splash-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .splash-card .meta { font-size: 14px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .name-input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; font-family: var(--font-ui); font-size: 16px; text-align: center; outline: none; transition: border-color .15s; margin-bottom: 16px; }
    .name-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.1); }
    .start-btn { width: 100%; padding: 14px; background: var(--purple); color: #fff; border: none; border-radius: 10px; font-family: var(--font-ui); font-size: 16px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .start-btn:hover { background: #7c3aed; }
    .start-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Question ── */
    .q-wrap { width: 100%; max-width: 600px; }

    .progress-bar-wrap { background: #e2e8f0; border-radius: 999px; height: 6px; margin-bottom: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--purple); border-radius: 999px; transition: width .4s; }
    .progress-label { font-size: 13px; color: var(--muted); text-align: right; margin-bottom: 24px; }

    .q-card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 40px 36px; text-align: center; position: relative; overflow: hidden;
    }

    /* Timer ring */
    .timer-ring-wrap { position: absolute; top: 16px; right: 20px; }
    .timer-ring { display: block; }
    .timer-bg { fill: none; stroke: #e2e8f0; stroke-width: 4; }
    .timer-arc { fill: none; stroke: var(--purple); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .9s linear, stroke .3s; transform: rotate(-90deg); transform-origin: center; }
    .timer-arc.warning { stroke: var(--red); }
    .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--text); }

    .q-direction { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 20px; }
    .q-prompt { margin-bottom: 32px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .q-prompt .he-text { font-family: var(--font-he); font-size: 42px; font-weight: 700; direction: rtl; line-height: 1.3; }
    .q-prompt .en-text { font-size: 28px; font-weight: 700; line-height: 1.4; }
    .q-type-hint { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    .answer-input {
      width: 100%; padding: 14px 18px; border: 2px solid var(--border); border-radius: 12px;
      font-family: var(--font-ui); font-size: 18px; text-align: center; outline: none;
      transition: border-color .15s; margin-bottom: 16px;
    }
    .answer-input.he-answer { font-family: var(--font-he); font-size: 22px; direction: rtl; }
    .answer-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.12); }
    .answer-input.correct { border-color: var(--green); background: #f0fdf4; }
    .answer-input.wrong { border-color: var(--red); background: #fef2f2; }

    .submit-btn { width: 100%; padding: 14px; background: var(--purple); color: #fff; border: none; border-radius: 10px; font-family: var(--font-ui); font-size: 16px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .submit-btn:hover { background: #7c3aed; }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

    .feedback { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; text-align: center; display: none; }
    .feedback.correct { background: #dcfce7; color: #15803d; display: block; }
    .feedback.wrong { background: #fee2e2; color: #dc2626; display: block; }
    .feedback .correct-answer { font-family: var(--font-he); font-size: 18px; direction: rtl; display: block; margin-top: 4px; }

    .next-btn { width: 100%; margin-top: 12px; padding: 12px; background: #1e293b; color: #fff; border: none; border-radius: 10px; font-family: var(--font-ui); font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; display: none; }
    .next-btn:hover { background: #334155; }

    /* ── Results ── */
    .results-card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 40px 40px; text-align: center; max-width: 500px; width: 100%;
    }
    .results-student-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: var(--purple); }
    .results-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .results-card .sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

    .result-rows { text-align: left; margin-bottom: 28px; }
    .result-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .result-row:last-child { border-bottom: none; }
    .result-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .result-row .he { font-family: var(--font-he); font-size: 18px; direction: rtl; }
    .result-row .en { font-size: 13px; color: var(--muted); }
    .result-row .given { font-size: 13px; color: var(--red); }

    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .result-actions button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-retry { background: var(--purple); color: #fff; } .btn-retry:hover { background: #7c3aed; }
    .btn-home { background: #f1f5f9; color: var(--text); } .btn-home:hover { background: #e2e8f0; }

    /* ── Saved badge ── */
    .saved-badge { display: none; align-items: center; gap: 6px; margin-top: 14px; padding: 8px 16px; background: #dcfce7; color: #15803d; border-radius: 8px; font-size: 13px; font-weight: 700; justify-content: center; }
    .saved-badge.visible { display: flex; }
    .saved-badge.error { background: #fee2e2; color: #dc2626; }

    /* ── No test ── */
    .no-test-card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 48px 40px; text-align: center; max-width: 440px; width: 100%;
    }
    .no-test-card .ei { font-size: 48px; margin-bottom: 16px; }
    .no-test-card p { font-size: 15px; color: var(--muted); line-height: 1.6; }
    .no-test-card a { display: inline-block; margin-top: 20px; padding: 11px 24px; background: var(--purple); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px; }

    /* ── Student picker grid ── */
    .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 20px 0 24px; max-height: 320px; overflow-y: auto; }
    .picker-btn { padding: 12px 8px; border: 2px solid var(--border); border-radius: 10px; background: #fff; font-family: var(--font-ui); font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; transition: all .15s; text-align: center; }
    .picker-btn:hover { border-color: var(--purple); background: #f5f3ff; }
    .picker-btn.selected { border-color: var(--purple); background: var(--purple); color: #fff; }
    .picker-fallback { margin-top: 8px; font-size: 13px; color: var(--muted); }

    /* ── Hebrew virtual keyboard ── */
    .heb-kb-wrap { margin-top: 8px; }
    .heb-kb-toggle { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer; font-family: var(--font-ui); margin-bottom: 6px; }
    .heb-kb-toggle:hover { background: #f1f5f9; color: var(--text); }
    .heb-kb { display: none; background: #f8faff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; }
    .heb-kb.open { display: block; }
    .heb-kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
    .heb-key { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-family: var(--font-he); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .1s; color: var(--text); padding: 0; }
    .heb-key:hover { background: var(--purple); color: #fff; border-color: var(--purple); }
    .heb-key:active { transform: scale(.92); }
    .heb-key.wide { width: 52px; font-size: 12px; font-family: var(--font-ui); color: var(--muted); }
    .heb-key.wide:hover { color: #fff; }
  </style>
</head>
<body>

<div class="rainbow-bar"></div>

<!-- Screen: no test configured -->
<div class="screen active" id="screenNoTest">
  <div class="no-test-card">
    <div class="ei">📋</div>
    <h2 style="font-size:20px;font-weight:800;margin-bottom:8px">No Active Test</h2>
    <p>A teacher needs to start a test from the Teacher Dashboard first.</p>
    <a href="teacher_dashboard.html">← Teacher Dashboard</a>
  </div>
</div>

<!-- Screen: student picker / name entry -->
<div class="screen" id="screenName">
  <div class="splash-card">
    <div class="block-label" id="splashBlock"></div>
    <h1 id="splashTitle">Vocabulary Test</h1>
    <p class="meta" id="splashMeta"></p>

    <!-- Roster picker (shown when students exist) -->
    <div id="rosterPicker" style="display:none">

    </div>

    <!-- Fallback free-text (shown when roster is empty) -->
    <div id="fallbackInput" style="display:none">
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name…" maxlength="40" onkeydown="if(event.key==='Enter')startTest()" />

    <button class="start-btn" id="startBtn" onclick="startTest()" disabled>Start Test →</button>
  </div>
</div>

<!-- Screen: question -->
<div class="screen" id="screenQ">
  <div class="q-wrap">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
    <div class="q-card">
      <!-- Timer -->
      <div class="timer-ring-wrap">
        <svg class="timer-ring" width="52" height="52" viewBox="0 0 52 52">
          <circle class="timer-bg" cx="26" cy="26" r="22" />
          <circle class="timer-arc" id="timerArc" cx="26" cy="26" r="22" />
        </svg>
        <div class="timer-num" id="timerNum">30</div>
      </div>

      <div class="q-direction" id="qDirection"></div>
      <div class="q-prompt" id="qPrompt"></div>
      <div class="q-type-hint" id="qTypeHint"></div>
      <input class="answer-input" id="answerInput" type="text" placeholder="Type your answer…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')submitAnswer()" />
      <!-- Hebrew virtual keyboard — shown only when answer is in Hebrew -->
      <div class="heb-kb-wrap" id="hebKbWrap" style="display:none">
        <button class="heb-kb-toggle" onclick="toggleHebKb()">⌨️ אבג מקלדת עברית</button>

          <div class="heb-kb-row">
            <button class="heb-key" onclick="hebType('ק')">ק</button><button class="heb-key" onclick="hebType('ר')">ר</button><button class="heb-key" onclick="hebType('א')">א</button><button class="heb-key" onclick="hebType('ט')">ט</button><button class="heb-key" onclick="hebType('ו')">ו</button><button class="heb-key" onclick="hebType('ן')">ן</button><button class="heb-key" onclick="hebType('ם')">ם</button><button class="heb-key" onclick="hebType('פ')">פ</button><button class="heb-key" onclick="hebType('ף')">ף</button>
          </div>
          <div class="heb-kb-row">
            <button class="heb-key" onclick="hebType('ש')">ש</button><button class="heb-key" onclick="hebType('ד')">ד</button><button class="heb-key" onclick="hebType('ג')">ג</button><button class="heb-key" onclick="hebType('כ')">כ</button><button class="heb-key" onclick="hebType('ע')">ע</button><button class="heb-key" onclick="hebType('י')">י</button><button class="heb-key" onclick="hebType('ח')">ח</button><button class="heb-key" onclick="hebType('ל')">ל</button><button class="heb-key" onclick="hebType('ך')">ך</button>
          </div>
          <div class="heb-kb-row">
            <button class="heb-key" onclick="hebType('ז')">ז</button><button class="heb-key" onclick="hebType('ס')">ס</button><button class="heb-key" onclick="hebType('ב')">ב</button><button class="heb-key" onclick="hebType('ה')">ה</button><button class="heb-key" onclick="hebType('נ')">נ</button><button class="heb-key" onclick="hebType('מ')">מ</button><button class="heb-key" onclick="hebType('צ')">צ</button><button class="heb-key" onclick="hebType('ת')">ת</button><button class="heb-key" onclick="hebType('ץ')">ץ</button>
          </div>
          <div class="heb-kb-row">
            <button class="heb-key" onclick="hebType('ּ')" title="דגש">ּ</button><button class="heb-key wide" onclick="hebType(' ')">רווח</button><button class="heb-key wide" onclick="hebBackspace()">⌫ מחק</button>
          </div>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">Submit →</button>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
    </div>
  </div>
</div>

<!-- Screen: results -->
<div class="screen" id="screenResults">
  <div class="results-card">
    <div class="results-student-name" id="resultStudentName"></div>
    <h2 id="resultTitle">Test Complete!</h2>
    <p class="sub" id="resultSub"></p>
    <div class="result-rows" id="resultRows"></div>
    <div class="saved-badge" id="savedBadge"></div>
    <div class="result-actions">
      <button class="btn-home" onclick="goHome()">← Back</button>
    </div>
  </div>
</div>

<script>
// ── Supabase ──────────────────────────────────────────────
let sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

// ── State ─────────────────────────────────────────────────
let testData = null;
let words = [];
let idx = 0;
let results = [];     // {word, given, correct}
let timerInterval = null;
let timeLeft = 30;
let answered = false;
let studentName = '';
let studentId = null;    // linked to students table
let isRetry = false;
let currentDir = 'he_to_en';  // direction of current question

// ── Hebrew virtual keyboard ────────────────────────────────
function toggleHebKb() {
  document.getElementById('hebKb').classList.toggle('open');
}

function hebType(char) {
  const inp = document.getElementById('answerInput');
  if (inp.disabled) return;
  const start = inp.selectionStart;
  const end = inp.selectionEnd;
  const val = inp.value;
  inp.value = val.slice(0, start) + char + val.slice(end);
  inp.selectionStart = inp.selectionEnd = start + char.length;
  inp.focus();
}

function hebBackspace() {
  const inp = document.getElementById('answerInput');
  if (inp.disabled) return;
  const start = inp.selectionStart;
  const end = inp.selectionEnd;
  if (start !== end) {
    inp.value = inp.value.slice(0, start) + inp.value.slice(end);
    inp.selectionStart = inp.selectionEnd = start;
  } else if (start > 0) {
    inp.value = inp.value.slice(0, start - 1) + inp.value.slice(start);
    inp.selectionStart = inp.selectionEnd = start - 1;
  }
  inp.focus();
}

// ── Load test from Supabase by ID ─────────────────────────
async function loadTestFromDB(testId) {
  try {
    const { data: test, error: testErr } = await sb.from('tests').select('*').eq('id', testId).single();
    if (testErr || !test) throw testErr || new Error('Test not found');
    const wordIds = Array.isArray(test.word_ids) ? test.word_ids : [];
    const { data: wordRows, error: wordErr } = await sb.from('words').select('*').in('id', wordIds);
    if (wordErr) throw wordErr;
    testData = {
      id: test.id,
      blockId: test.block_id,
      timerPerWord: test.timer_per_word,
      direction: test.direction,
      status: test.status,
      wordIds: wordIds,
      words: wordRows || [],
      blockLabel: ''
    };
    await initTestUI();
  } catch(e) {
    show('screenNoTest');
  }
}

// ── Load test from localStorage ───────────────────────────
function loadTestFromLocal() {
  try {
    const raw = localStorage.getItem('gm_active_test');
    if (raw) testData = JSON.parse(raw);
  } catch(e) {}
  initTestUI();
}

// ── Init test UI after testData is ready ──────────────────
async function initTestUI() {
  if (!testData || !testData.words || !testData.words.length) {
    show('screenNoTest');
    return;
  }
  words = shuffle([...testData.words]);
  show('screenName');
  document.getElementById('splashBlock').textContent = testData.blockLabel ? 'Block · ' + testData.blockLabel : 'Vocabulary Test';
  document.getElementById('splashTitle').textContent = 'Vocabulary Test';
  const dir = testData.direction === 'he_to_en' ? 'Hebrew → English' : 'English → Hebrew';
  document.getElementById('splashMeta').textContent =
    `${words.length} words · ${testData.timerPerWord}s per word · ${dir}`;

  // Load student roster
  await buildStudentPicker();
}

async function buildStudentPicker() {
  let roster = [];
  if (sb) {
    try {
      const { data } = await sb.from('students').select('*').order('name');
      roster = data || [];
    } catch(e) {}
  }

  const pickerGrid = document.getElementById('pickerGrid');
  const rosterPicker = document.getElementById('rosterPicker');
  const fallbackInput = document.getElementById('fallbackInput');
  const startBtn = document.getElementById('startBtn');

  if (roster.length > 0) {
    // Roster mode
    rosterPicker.style.display = '';
    fallbackInput.style.display = 'none';
    pickerGrid.innerHTML = roster.map(s =>
      `<button class="picker-btn" data-id="${esc(s.id)}" data-name="${esc(s.name)}" onclick="selectStudent(this)">${esc(s.nickname || s.name)}</button>`
    ).join('');
    startBtn.disabled = true;
  } else {
    // Fallback: free text
    rosterPicker.style.display = 'none';
    fallbackInput.style.display = '';
    startBtn.disabled = false;
    const ni = document.getElementById('nameInput');
    if (ni) {
      ni.addEventListener('input', () => { startBtn.disabled = ni.value.trim().length === 0; });
      ni.focus();
    }
  }
}

function selectStudent(btn) {
  // Deselect all
  document.querySelectorAll('.picker-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  studentName = btn.dataset.name;
  studentId = btn.dataset.id;
  document.getElementById('startBtn').disabled = false;
}

// ── Init ──────────────────────────────────────────────────
const testId = new URLSearchParams(location.search).get('test');
if (testId) {
  // fetch from Supabase via URL param
  loadTestFromDB(testId);
} else {
  // localStorage fallback (existing behavior)
  loadTestFromLocal();
}

function startTest() {
  // If roster picker is active, studentName/studentId are already set by selectStudent()
  // If fallback text input is active, read from it
  const fallbackVisible = document.getElementById('fallbackInput').style.display !== 'none';
  if (fallbackVisible) {
    studentName = (document.getElementById('nameInput').value.trim()) || 'Student';
    studentId = null;
  }
  if (!studentName) return;
  idx = 0; results = [];
  showQuestion();
  show('screenQ');
}

// ── Question flow ─────────────────────────────────────────
function showQuestion() {
  answered = false;
  const w = words[idx];
  const total = words.length;
  const pct = (idx / total) * 100;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Question ${idx + 1} of ${total}`;

  // Determine direction for this question
  let isHeEn;
  if (testData.direction === 'mixed') {
    isHeEn = Math.random() < 0.5;
  } else {
    isHeEn = testData.direction === 'he_to_en';
  }
  // Store direction on the question for results display
  currentDir = isHeEn ? 'he_to_en' : 'en_to_he';

  document.getElementById('qDirection').textContent = isHeEn ? 'What is the English meaning?' : 'What is the Hebrew/Aramaic?';

  const promptEl = document.getElementById('qPrompt');
  if (isHeEn) {
    promptEl.innerHTML = `<span class="he-text">${esc(w.hebrew)}</span>`;
  } else {
    promptEl.innerHTML = `<span class="en-text">${esc(w.english)}</span>`;
  }

  const typeHintEl = document.getElementById('qTypeHint');
  typeHintEl.textContent = w.type === 'shoresh' ? 'שורש — root' : 'מילה — word';

  const ansInput = document.getElementById('answerInput');
  ansInput.value = '';
  ansInput.className = 'answer-input' + (!isHeEn ? ' he-answer' : '');
  ansInput.placeholder = isHeEn ? 'Type English meaning…' : 'הקלד/י בעברית…';
  ansInput.disabled = false;
  ansInput.style.borderColor = '';
  ansInput.style.background = '';

  // Show/hide Hebrew keyboard
  const kbWrap = document.getElementById('hebKbWrap');
  const kb = document.getElementById('hebKb');
  kbWrap.style.display = isHeEn ? 'none' : '';
  kb.classList.remove('open'); // always start closed

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('submitBtn').disabled = false;

  startTimer(testData.timerPerWord);
  setTimeout(() => ansInput.focus(), 50);
}

function submitAnswer() {
  if (answered) return;
  clearTimer();
  answered = true;

  const w = words[idx];
  const isHeEn = currentDir === 'he_to_en';
  const given = document.getElementById('answerInput').value.trim();
  const correct = isHeEn ? w.english : w.hebrew;
  const isCorrect = normalize(given) === normalize(correct);

  results.push({ word: w, given, correct, isCorrect, dir: currentDir });

  const ansInput = document.getElementById('answerInput');
  ansInput.disabled = true;
  ansInput.classList.add(isCorrect ? 'correct' : 'wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  if (isCorrect) {
    fb.textContent = '✓ Correct!';
  } else {
    fb.innerHTML = `✗ Not quite. The answer is: <span class="correct-answer">${esc(correct)}</span>`;
  }

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = idx < words.length - 1 ? 'Next →' : 'See Results →';
  document.getElementById('nextBtn').focus();
}

function nextQuestion() {
  idx++;
  if (idx < words.length) {
    showQuestion();
  } else {
    showResults();
  }
}

// ── Timer ─────────────────────────────────────────────────
function startTimer(seconds) {
  clearTimer();
  timeLeft = seconds;
  const arc = document.getElementById('timerArc');
  const num = document.getElementById('timerNum');
  const r = 22;
  const circ = 2 * Math.PI * r;
  arc.style.strokeDasharray = circ;

  function tick() {
    const frac = timeLeft / seconds;
    arc.style.strokeDashoffset = circ * (1 - frac);
    num.textContent = timeLeft;
    arc.classList.toggle('warning', timeLeft <= Math.ceil(seconds * 0.25));
    if (timeLeft <= 0) {
      clearTimer();
      if (!answered) {
        const w = words[idx];
        const isHeEn = currentDir === 'he_to_en';
        const correct = isHeEn ? w.english : w.hebrew;
        results.push({ word: w, given: '', correct, isCorrect: false, dir: currentDir });
        answered = true;

        const ansInput = document.getElementById('answerInput');
        ansInput.disabled = true;
        ansInput.classList.add('wrong');

        const fb = document.getElementById('feedback');
        fb.className = 'feedback wrong';
        fb.innerHTML = `⏱ Time's up! The answer was: <span class="correct-answer">${esc(correct)}</span>`;

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'block';
        document.getElementById('nextBtn').textContent = idx < words.length - 1 ? 'Next →' : 'See Results →';
      }
    }
  }

  tick();
  timerInterval = setInterval(() => { timeLeft--; tick(); }, 1000);
}

function clearTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

// ── Results ───────────────────────────────────────────────
function showResults() {
  clearTimer();
  const correct = results.filter(r => r.isCorrect).length;
  const total = results.length;

  document.getElementById('resultStudentName').textContent = studentName;
  document.getElementById('resultTitle').textContent = 'Test Complete! 🎉';
  document.getElementById('resultSub').textContent = `You answered ${total} question${total!==1?'s':''}. Your teacher will give you your grade.`;

  document.getElementById('resultRows').innerHTML = results.map(r => {
    const isHeQ = r.dir === 'en_to_he'; // question was in English, answer in Hebrew
    return `
    <div class="result-row">
      <span class="result-icon">${r.isCorrect ? '✅' : '❌'}</span>
      <div style="flex:1;min-width:0">
        <div class="he" style="${!isHeQ ? '' : 'font-size:14px;color:var(--muted)'}">${esc(r.word.hebrew)}</div>
        <div class="en" style="${isHeQ ? '' : 'font-size:13px;color:var(--muted)'}">${esc(r.word.english)}</div>
        ${!r.isCorrect && r.given ? `<div class="given">You wrote: "${esc(r.given)}"</div>` : ''}
        ${!r.isCorrect && !r.given ? `<div class="given">No answer / time expired</div>` : ''}
      </div>
    </div>`}).join('');

  show('screenResults');
  saveResultToDB(correct, total);
}

async function saveResultToDB(correct, total) {
  const badge = document.getElementById('savedBadge');
  if (isRetry) { badge.textContent = '↺ Practice run — not saved'; badge.className = 'saved-badge visible'; return; }
  if (!sb || !testData || !testData.id) return;
  try {
    const answers = results.map(r => ({
      word_id: r.word.id,
      correct: r.isCorrect,
      given: r.given,
      dir: r.dir
    }));
    const { error } = await sb.from('test_results').insert({
      id: crypto.randomUUID(),
      test_id: testData.id,
      student_name: studentName,
      student_id: studentId || null,
      score: correct,
      total: total,
      answers,
      submitted_at: new Date().toISOString()
    });
    if (error) throw error;
    badge.textContent = '✓ Saved';
    badge.className = 'saved-badge visible';
  } catch(e) {
    badge.textContent = '⚠ ' + (e.message || e.code || JSON.stringify(e));
    badge.className = 'saved-badge visible error';
  }
}

function retryTest() {
  isRetry = true;
  words = shuffle([...testData.words]);
  idx = 0; results = [];
  // Keep studentName/studentId — it's the same student retrying
  showQuestion();
  show('screenQ');
}

function goHome() {
  window.location.href = 'index.html';
}

// ── Utilities ─────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function normalize(s) {
  return String(s||'').toLowerCase().trim()
    .replace(/[\u0591-\u05C7]/g, '')   // strip ALL Hebrew nikud + cantillation
    .replace(/\./g, '')                 // remove dots (shoresh notation: ב.ו.א → בוא)
    .replace(/"/g, '')                  // remove geresh/gershayim
    .replace(/׳/g, '').replace(/״/g, '')
    .replace(/\s+/g, ' ');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
